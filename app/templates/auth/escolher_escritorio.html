<!DOCTYPE html>
<html lang="pt-BR" data-tema="{{ tema_modo }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Selecione o escritório</title>

{% include "_favicon.html" %}

<style>
  @font-face { font-family:'Inter'; font-style:normal; font-weight:400; font-display:swap;
    src:url('{{ url_for("static", filename="fonts/inter/inter-latin-400-normal.woff2") }}') format('woff2'); }
  @font-face { font-family:'Inter'; font-style:normal; font-weight:600; font-display:swap;
    src:url('{{ url_for("static", filename="fonts/inter/inter-latin-600-normal.woff2") }}') format('woff2'); }
  @font-face { font-family:'Inter'; font-style:normal; font-weight:700; font-display:swap;
    src:url('{{ url_for("static", filename="fonts/inter/inter-latin-700-normal.woff2") }}') format('woff2'); }

  *, *::before, *::after { box-sizing:border-box; margin:0; padding:0; }

  :root, html[data-tema="claro"] {
    --azul:{{ tema_cor.principal }}; --azul2:{{ tema_cor.secundaria }};
    --cinza1:#F4F2EC; --cinza2:#E6E2D8; --cinza3:#D8D4C8;
    --texto:#16181C; --sub:#63697A;
    --card-bg:#ffffff; --body-bg:#FAFAF7;
    --nav-fg:{{ tema_cor.contraste }};
    --sombra:0 1px 3px rgba(20,18,14,.06);
  }
  html[data-tema="escuro"] {
    --azul:{{ tema_cor.secundaria }}; --azul2:{{ tema_cor.secundaria }};
    --cinza1:#2B2620; --cinza2:#3E3830; --cinza3:#544D40;
    --texto:#ECEAE3; --sub:#A79F8E;
    --card-bg:#211E19; --body-bg:#131210;
    --nav-fg:{{ tema_cor.contraste_sec }};
    --sombra:0 1px 4px rgba(0,0,0,.5);
  }

  body {
    font-family:'Inter',system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(circle at 15% -10%, color-mix(in srgb, var(--azul) 22%, transparent), transparent 55%),
      radial-gradient(circle at 100% 110%, color-mix(in srgb, var(--azul2) 16%, transparent), transparent 55%),
      var(--body-bg);
    color:var(--texto);
    min-height:100vh;
    display:flex; align-items:center; justify-content:center;
    padding:24px;
    -webkit-font-smoothing:antialiased;
  }

  .card {
    background:var(--card-bg);
    border:1px solid var(--cinza2);
    border-radius:16px;
    box-shadow:0 12px 40px rgba(20,18,14,.14), var(--sombra);
    padding:40px 36px;
    width:100%; max-width:380px;
  }

  h1 { font-size:19px; font-weight:700; color:var(--texto); margin-bottom:4px; text-align:center; }
  p.sub { font-size:13px; color:var(--sub); text-align:center; margin-bottom:26px; }

  .lista { display:flex; flex-direction:column; gap:10px; }
  .item {
    display:flex; align-items:center; gap:12px;
    border:1px solid var(--cinza3); border-radius:10px;
    padding:14px 16px; text-decoration:none; color:var(--texto);
    transition:border-color .15s, background .15s;
  }
  .item:hover { border-color:var(--azul); background:var(--cinza1); }
  .item .nome { font-size:14.5px; font-weight:600; }
  .item .icon { width:18px; height:18px; color:var(--sub); margin-left:auto; }

  .vazio { font-size:13px; color:var(--sub); text-align:center; }
</style>
</head>
<body>
<div class="card">
  <h1>Qual escritório?</h1>
  <p class="sub">Selecione o escritório que deseja acessar</p>

  {% if escritorios %}
    <div class="lista">
      {% for e in escritorios %}
        <a class="item" href="{{ url_for('auth.login_escritorio', slug=e.slug) }}">
          <span class="nome">{{ e.nome }}</span>
          {{ icon('open', 'icon') }}
        </a>
      {% endfor %}
    </div>
  {% else %}
    <p class="vazio">Nenhum escritório ativo no momento.</p>
  {% endif %}
</div>
</body>
</html>
